<figure class="orca-chart-frame orca-chart-frame--{{ kind }}">
  {% if title or subtitle %}<div class="orca-chart-frame__head"><div>{% if title %}<h3 class="orca-panel-title">{{ title }}</h3>{% endif %}{% if subtitle %}<p class="orca-small orca-muted">{{ subtitle }}</p>{% endif %}</div></div>{% endif %}
  {% if show_legend and not round %}<ul class="orca-legend">{% for l in legend %}<li class="orca-legend__item"><span class="orca-swatch" style="--orca-swatch: var(--c); {{ l.style }}"></span>{{ l.name }}</li>{% endfor %}</ul>{% endif %}
  <div class="orca-chart-wrap{% if round %} orca-chart-wrap--round{% endif %}">{{ svg|safe }}{% if round %}<ul class="orca-legend orca-legend--column">{% for l in legend %}<li class="orca-legend__item"><span class="orca-swatch" style="--orca-swatch: var(--c); {{ l.style }}"></span>{{ l.name }}<span class="orca-legend__value">{{ l.value }}</span></li>{% endfor %}</ul>{% endif %}</div>
  {% if caption %}<figcaption class="orca-chart-frame__caption">{{ caption }}</figcaption>{% endif %}
  <details><summary>Show data</summary><div class="orca-table-wrap"><table class="orca-table orca-table--compact">
    <thead><tr>{% for h in head %}<th scope="col"{% if not forloop.first %} class="is-num"{% endif %}>{{ h }}</th>{% endfor %}</tr></thead>
    <tbody>{% for r in rows %}<tr>{% for c in r %}{% if forloop.first %}<th scope="row">{{ c }}</th>{% else %}<td class="is-num">{{ c }}</td>{% endif %}{% endfor %}</tr>{% endfor %}</tbody>
  </table></div></details>
</figure>
