name: Release to PyPI

# On every commit to main: test, bump the patch version, commit the bump back,
# tag it, build and upload to PyPI with the PYPI_API_TOKEN repository secret.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  actions: write # to dispatch the documentation deploy after the bump commit

# One release at a time so two pushes never compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The bump commit is pushed with GITHUB_TOKEN (which does not retrigger workflows);
    # this guard is a second safety net against a release loop.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # latest main, not the triggering SHA, so queued runs never push a stale tree
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . build twine
      - name: Test
        run: python -m django test tests --settings=tests.settings
      - name: Bump version
        id: bump
        run: echo "version=$(python .github/scripts/bump_version.py "${{ inputs.bump || 'patch' }}")" >> "$GITHUB_OUTPUT"
      - name: Build
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # A pasted token often carries a trailing newline or space, which PyPI rejects with 403.
          token="$(printf %s "$PYPI_API_TOKEN" | tr -d '[:space:]')"
          if [ -z "$token" ]; then
            echo "::error::Repository secret PYPI_API_TOKEN is empty or not available to this workflow."
            exit 1
          fi
          case "$token" in
            pypi-*) ;;
            *) echo "::error::PYPI_API_TOKEN does not start with 'pypi-': paste the full token created at pypi.org/manage/account/token/."; exit 1 ;;
          esac
          TWINE_PASSWORD="$token" twine upload --verbose dist/*
      - name: Commit the bump and tag it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml orca/__init__.py
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git tag -a "v${{ steps.bump.outputs.version }}" -m "Release v${{ steps.bump.outputs.version }}"
          git push origin main "v${{ steps.bump.outputs.version }}"
      # The bump commit is pushed with GITHUB_TOKEN, which does not trigger the push workflows,
      # so deploy the documentation explicitly to show the new version and release date.
      - name: Deploy the documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
